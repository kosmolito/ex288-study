# Source: lamp-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lamp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lamp-app
  template:
    metadata:
      labels:
        app: lamp-app
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z "lamp-app-mariadb" 3306; do
                echo "waiting for db..."
                sleep 2
              done
      containers:
        - name: apache-php
          image: "kosmolito/php82-nonroot:latest"
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "lamp-app-mariadb"
            - name: DB_DATABASE
              value: lamp_db
            - name: DB_USER
              value: lamp_user
            - name: DB_PASSWORD
              value: lampPassword
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
            - name: app-code
              mountPath: /etc/apache2/ports.conf
              subPath: apache.conf
          resources: {}
      volumes:
        - name: app-code
          configMap:
            name: lamp-app
